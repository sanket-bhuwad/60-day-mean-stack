<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form | CSS Basics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-card">
    <p class="eyebrow">CSS basics</p>
    <h1>Join our community</h1>
    <p class="intro">Create an account to get started.</p>

    <form action="#" method="post">
      <div class="form-row">
        <div class="field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
        <small>Use at least 8 characters.</small>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Choose a country</option>
          <option value="india">India</option>
          <option value="united-kingdom">United Kingdom</option>
          <option value="united-states">United States</option>
          <option value="other">Other</option>
        </select>
      </div>

      <fieldset>
        <legend>Preferred contact method</legend>
        <div class="options">
          <label><input type="radio" name="contact_method" value="email" checked> Email</label>
          <label><input type="radio" name="contact_method" value="phone"> Phone</label>
        </div>
      </fieldset>

      <label class="terms">
        <input type="checkbox" name="terms" required>
        I agree to the terms and conditions.
      </label>

      <div class="actions">
        <button class="button button-secondary" type="reset">Clear form</button>
        <button class="button button-primary" type="submit">Create account</button>
      </div>
    </form>
  </main>
</body>
</html>
