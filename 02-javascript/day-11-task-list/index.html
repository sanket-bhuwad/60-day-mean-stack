<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List | Day 11</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="task-card">
    <p class="eyebrow">Day 11 revision</p>
    <h1>My task list</h1>
    <p class="intro">Keep track of small wins and finish what matters.</p>

    <form class="task-form" id="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" name="task" type="text" placeholder="What needs to be done?" maxlength="120" required>
      <button class="button button-primary" type="submit">Add task</button>
    </form>

    <div class="list-heading">
      <h2>Tasks</h2>
      <span class="task-count" id="task-count">0 tasks</span>
    </div>

    <ul class="task-list" id="task-list" aria-live="polite"></ul>
    <p class="empty-state" id="empty-state">No tasks yet. Add one above to get started.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
