<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #172033;
      background: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    .form-card {
      width: min(100%, 520px);
      padding: 40px;
      background: #ffffff;
      border: 1px solid #dbe2f0;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(37, 52, 94, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .intro {
      margin: 0 0 28px;
      color: #536078;
      line-height: 1.5;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    label,
    legend {
      font-size: 0.9rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      color: inherit;
      font: inherit;
      background: #fbfcff;
      border: 1px solid #c8d1e2;
      border-radius: 8px;
    }

    input:focus,
    select:focus {
      border-color: #4f46e5;
      outline: 3px solid rgba(79, 70, 229, 0.18);
    }

    fieldset {
      margin: 2px 0 24px;
      padding: 0;
      border: 0;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 12px;
    }

    .option,
    .terms {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
    }

    .option input,
    .terms input {
      width: auto;
      accent-color: #4f46e5;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .submit-button {
      color: #ffffff;
      background: #4f46e5;
    }

    .submit-button:hover {
      background: #4338ca;
    }

    .reset-button {
      color: #34405a;
      background: #e8ecf5;
    }

    .reset-button:hover {
      background: #dce2ee;
    }

    @media (max-width: 520px) {
      .form-card {
        padding: 28px 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .actions {
        flex-direction: column-reverse;
      }
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h1>Create an account</h1>
    <p class="intro">Join our community by completing the form below.</p>

    <form action="#" method="post">
      <div class="form-row">
        <div class="field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" autocomplete="given-name" required>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Select your country</option>
          <option value="india">India</option>
          <option value="united-kingdom">United Kingdom</option>
          <option value="united-states">United States</option>
          <option value="other">Other</option>
        </select>
      </div>

      <fieldset>
        <legend>Preferred contact method</legend>
        <div class="options">
          <label class="option">
            <input type="radio" name="contact_method" value="email" checked>
            Email
          </label>
          <label class="option">
            <input type="radio" name="contact_method" value="phone">
            Phone
          </label>
        </div>
      </fieldset>

      <div class="field">
        <label class="terms">
          <input type="checkbox" name="terms" required>
          I agree to the terms and conditions.
        </label>
      </div>

      <div class="actions">
        <button class="reset-button" type="reset">Clear form</button>
        <button class="submit-button" type="submit">Create account</button>
      </div>
    </form>
  </main>
</body>
</html>
